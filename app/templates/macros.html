{% macro token(csrf) %}<input type="hidden" name="csrf" value="{{ csrf }}">{% endmacro %}
{% macro interaction(csrf, id, items, row=none) %}
<form method="post" action="/observations/{{ id }}/interaction">{{ token(csrf) }}{% if row %}<input type="hidden" name="id" value="{{ row.id }}">{% endif %}
<label>こちらがしたこと<textarea name="owner_action" required maxlength="3000">{{ row.owner_action if row else '' }}</textarea></label>
<div class="columns"><label>働きかけの日時（不明なら空欄）<input type="datetime-local" name="acted_at" value="{{ row.acted_at|inputtime if row else '' }}"></label><label>使った合図<select name="cue_item_id"><option value="">指定なし</option>{% for item in items if item.kind=='cue' %}<option value="{{ item.id }}" {% if row and row.cue_item_id==item.id %}selected{% endif %}>{{ item.title }}</option>{% endfor %}</select></label></div>
<label>メメの反応（後から追記できます）<textarea name="cat_response" maxlength="3000">{{ row.cat_response or '' if row else '' }}</textarea></label><label>反応の日時（不明なら空欄）<input type="datetime-local" name="responded_at" value="{{ row.responded_at|inputtime if row else '' }}"></label><button>働きかけと反応を保存</button></form>
{% endmacro %}
