# テスト専用。compose.yamlとは重ねず、scripts/test.pyから使用する。
name: project-meme-test
x-test-app: &test-app
  build: .
  image: ${COMPOSE_PROJECT_NAME}:test
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 2g
  cpus: 2
  pids_limit: 128
  environment: &test-env
    DATABASE_URL: postgresql+psycopg://meme_app:test-app-only@db:5432/meme
    SECRET_KEY: test-only-key-never-used-outside-disposable-environment
    MEDIA_ROOT: /tmp/meme-test-media
    BASE_URL: http://localhost:8000
    JOB_INTERVAL: '3600'
    MEME_TEST_MODE: '1'
services:
  db:
    image: ${COMPOSE_PROJECT_NAME}:db
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: meme
      POSTGRES_USER: meme_owner
      POSTGRES_PASSWORD: test-owner-only
      APP_DB_PASSWORD: test-app-only
    volumes:
      - postgres:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U meme_owner -d meme']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *test-app
    environment:
      <<: *test-env
      DATABASE_URL: postgresql+psycopg://meme_owner:test-owner-only@db:5432/meme
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  tests:
    <<: *test-app
    command: [python, -m, pytest, -q, -p, no:cacheprovider, tests]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    <<: *test-app
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres:
