name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 毎週月曜 03:23 UTC（12:23 JST）。新たに公開された脆弱性も確認する。
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit locked Python dependencies in disposable Docker
        run: python3 scripts/security_check.py
  pysr-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit experimental Python dependencies in disposable Docker
        run: python3 scripts/check_pysr.py --audit
