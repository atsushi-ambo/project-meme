name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 毎週月曜 03:23 UTC（12:23 JST）。新たに公開された脆弱性も確認する。
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Audit locked Python dependencies in disposable Docker
        run: python3 scripts/security_check.py
